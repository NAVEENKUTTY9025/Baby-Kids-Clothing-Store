<head>

    <!-- Google Fonts -->

        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ----- NO SCROLL — fit exactly one screen ----- */
        html,
        body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #FFF9F6;
            color: #111111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0;

        .dark body {

            color: #F4F1DE;
        }

        /* Dark mode fallback text contrast overrides */
        .dark .text-slate {
            color: #F4F1DE;
        }
        .dark .text-dusk {
            color: #9CA3AF;
        }
        .dark input,
        .dark select,
        .dark textarea {
            color: #FFFFFF !important;
        }

        /* toggle buttons — positioned top-right */
        .theme-toggle-wrapper {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 1000;
            display: flex;
            gap: 6px;
        }

        .toggle-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: inline-flex;

        }

        .dark .toggle-btn {
            background: #1E1E1E;
            color: #FFBFA3;
            border-color: rgba(255, 191, 163, 0.3);
        }

        .toggle-btn:hover {
            background: #FFBFA3;
            color: white;
        }

        .dark .toggle-btn:hover {
            background: #FFBFA3;
            color: white;
        }

        .toggle-btn.active {

            color: white;

        /* SIGNUP CARD — LITTLE NEST theme */
        .signup-card {
            background: white;
            border-radius: 36px;
            padding: 1.8rem 2rem;
            box-shadow: 0 20px 45px rgba(255, 191, 163, 0.12);

            transition: background 0.2s ease;

        .dark .signup-card {

            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);

        /* input styling */
        .signup-input {
            width: 100%;

            border-radius: 50px;
            border: 1px solid #F0E3DC;

            color: #F4F1DE;
        }

        .signup-input:focus {

        /* password wrapper for eye icon */

            width: 100%;

        .toggle-password {

            right: 1.1rem;

        /* primary button */

<body class="bg-cream dark:bg-canvas-dark warm-pattern">


    <!-- ===== THEME TOGGLES - TOP-RIGHT ===== -->
    <div class="theme-toggle-wrapper">
        <button id="theme-toggle" class="toggle-btn" title="Dark / Light">
            <i class="fas fa-sun"></i>
        </button>
        <button id="rtl-toggle" class="toggle-btn" title="RTL / LTR">
            ⇄
        </button>
    </div>

    <!-- ===== SIGNUP CARD ===== -->
    <div class="container-tight">
        <div class="signup-card">

            <!-- ===== LOGO - CENTERED ===== -->
            <div class="logo-center mb-6">
                <a href="index.html" class="font-display font-bold tracking-tight text-2xl md:text-3xl text-slate dark:text-white">
                    <span class="text-terracotta">LITTLE</span> NEST
                </a>

                <h1 class="welcome-title">Welcome to the Nest</h1>
                <p class="welcome-subtitle">Create an account to shop & manage your little one's wardrobe</p>
            </div>

            <!-- ===== SIGNUP FORM with EYE ICON on password fields ===== -->
            <form id="signupForm" class="space-y-4" action="#" method="GET">

                <!-- full name field -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-terracotta input-icon">
                        <i class="fas fa-user w-4 text-sm"></i>
                    </span>
                    <input type="text" id="fullName" name="name" placeholder="Full name" required
                        class="signup-input text-sm md:text-sm">
                </div>

                <!-- email field -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-terracotta input-icon">
                        <i class="fas fa-envelope w-4 text-sm"></i>
                    </span>
                    <input type="email" id="email" name="email" placeholder="Email address" required
                        class="signup-input text-sm md:text-sm">
                </div>

                <!-- password field with eye icon -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-terracotta input-icon">
                        <i class="fas fa-lock w-4 text-sm"></i>
                    </span>
                    <input type="password" id="signup-password" name="password" placeholder="Password" required
                        class="signup-input text-sm md:text-sm">
                    <button type="button" class="toggle-password" data-target="signup-password"
                        aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <!-- confirm password field with eye icon -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-terracotta input-icon">
                        <i class="fas fa-lock w-4 text-sm"></i>
                    </span>
                    <input type="password" id="signup-confirm-password" name="confirm_password"
                        placeholder="Confirm password" required class="signup-input text-sm md:text-sm">
                    <button type="button" class="toggle-password" data-target="signup-confirm-password"
                        aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <!-- terms and conditions checkbox -->
                <div class="flex items-start space-x-2 rtl:space-x-reverse mt-1">
                    <input type="checkbox" id="terms"
                        class="mt-0.5 rounded border-gray-300 dark:border-gray-600 text-terracotta focus:ring-terracotta/30 dark:bg-gray-700"
                        required>
                    <label for="terms" class="terms-text">
                        I agree to the <a href="#" class="terms-link" id="termsLink">Terms of Service</a> and <a
                            href="#" class="terms-link" id="privacyLink">Privacy Policy</a>
                    </label>
                </div>

                <!-- SIGN UP BUTTON -->
                <button type="submit" class="nest-btn mt-2">
                    <i class="fas fa-heart mr-2"></i> Create Account
                </button>
            </form>

            <!-- ===== Divider + Social Options (Google & Apple) ===== -->
            <div class="divider">
                <span>or sign up with</span>
            </div>

            <div class="social-btn-row">
                <button class="social-btn group" id="googleSignupBtn">
                    <i class="fab fa-google"></i>
                    <span>Google</span>
                </button>
                <button class="social-btn group" id="appleSignupBtn">
                    <i class="fab fa-apple"></i>
                    <span>Apple</span>
                </button>
            </div>

            <!-- ===== LOGIN LINK ===== -->
            <div class="mt-4 text-center">
                <span class="text-sm md:text-base font-semibold text-dusk dark:text-gray-400">Already have an account?</span>
                <a href="login.html"
                    class="text-sm md:text-base font-bold text-terracotta dark:text-terracotta hover:text-terracotta-dark ml-1 rtl:mr-1 hover:underline">
                    Sign in
                </a>
            </div>

        

        </div>
    </div>


    <!-- ===== DARK / LIGHT + RTL TOGGLE SCRIPT + EYE ICON FUNCTIONALITY ===== -->
    <script>
            (function () {
                // ---------- THEME ----------
                const themeToggle = document.getElementById('theme-toggle');

                function setTheme(isDark) {
                    if (isDark) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }

                    const icon = themeToggle?.querySelector('i');
                    if (icon) {
                        icon.classList.remove('fa-sun', 'fa-moon');
                        icon.classList.add(isDark ? 'fa-moon' : 'fa-sun');
                    }

                    if (isDark) {
                        themeToggle?.classList.add('active');
                        localStorage.setItem('theme', 'dark');
                    } else {
                        themeToggle?.classList.remove('active');
                        localStorage.setItem('theme', 'light');
                    }
                }

                // Check for saved theme or system preference
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme === 'dark') {
                    setTheme(true);
                } else if (savedTheme === 'light') {
                    setTheme(false);
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    setTheme(true);
                } else {
                    setTheme(false);
                }

                if (themeToggle) {
                    themeToggle.addEventListener('click', (e) => {
                        e.preventDefault();
                        setTheme(!document.documentElement.classList.contains('dark'));
                    });
                }

                // ---------- RTL ----------
                const rtlBtn = document.getElementById('rtl-toggle');
                function setRTL(isRTL) {
                    if (isRTL) {
                        document.documentElement.dir = 'rtl';
                        document.documentElement.lang = 'ar';
                        rtlBtn?.classList.add('active');
                        localStorage.setItem('dir', 'rtl');
                    } else {
                        document.documentElement.dir = 'ltr';
                        document.documentElement.lang = 'en';
                        rtlBtn?.classList.remove('active');
                        localStorage.setItem('dir', 'ltr');
                    }
                }
                const savedDir = localStorage.getItem('dir');
                savedDir === 'rtl' ? setRTL(true) : setRTL(false);

                if (rtlBtn) {
                    rtlBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        setRTL(document.documentElement.dir !== 'rtl');
                    });
                }

                // ---------- EYE ICON TOGGLE PASSWORD VISIBILITY ----------
                const toggleButtons = document.querySelectorAll('.toggle-password');
                toggleButtons.forEach(button => {
                    button.addEventListener('click', function (e) {
                        e.preventDefault();
                        const targetId = this.getAttribute('data-target');
                        const passwordInput = document.getElementById(targetId);
                        if (passwordInput) {
                            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                            passwordInput.setAttribute('type', type);
                            const icon = this.querySelector('i');
                            if (icon) {
                                if (type === 'text') {
                                    icon.classList.remove('fa-eye-slash');
                                    icon.classList.add('fa-eye');
                                } else {
                                    icon.classList.remove('fa-eye');
                                    icon.classList.add('fa-eye-slash');
                                }
                            }
                        }
                    });
                });

                // ---------- SOCIAL BUTTONS (Google & Apple) interactive demo ----------
                const googleBtn = document.getElementById('googleSignupBtn');
                const appleBtn = document.getElementById('appleSignupBtn');

                if (googleBtn) {
                    googleBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        alert('✨ Google sign up coming soon!');
                    });
                }
                if (appleBtn) {
                    appleBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        alert('✨ Apple sign up coming soon!');
                    });
                }

                // ---------- TERMS & PRIVACY LINKS ----------
                const termsLink = document.getElementById('termsLink');
                const privacyLink = document.getElementById('privacyLink');

                if (termsLink) {
                    termsLink.addEventListener('click', (e) => {
                        e.preventDefault();
                        alert('📜 Terms of Service would open here.');
                    });
                }
                if (privacyLink) {
                    privacyLink.addEventListener('click', (e) => {
                        e.preventDefault();
                        alert('🔒 Privacy Policy would open here.');
                    });
                }

                // ---------- PASSWORD MATCH + FORM SUBMIT ----------
                const signupForm = document.getElementById('signupForm');

                if (signupForm) {
                    signupForm.addEventListener('submit', function (e) {
                        e.preventDefault();

                        const password = document.getElementById('signup-password')?.value;
                        const confirm = document.getElementById('signup-confirm-password')?.value;
                        const termsCheck = document.getElementById('terms');
                        const fullName = document.getElementById('fullName')?.value;
                        const email = document.getElementById('email')?.value;

                        if (!fullName || !email) {
                            alert('✨ Please enter your name and email address to join the Nest!');
                            return false;
                        }

                        if (password !== confirm) {
                            alert('⚠️ Passwords do not match. Please re-enter your password.');
                            return false;
                        }

                        if (password && password.length < 6) {
                            alert('🔐 Password must be at least 6 characters long.');
                            return false;
                        }

                        if (!termsCheck.checked) {
                            alert('📜 Please accept the Terms of Service and Privacy Policy to continue.');
                            return false;
                        }

                        // Direct redirect to login.html as requested
                        window.location.href = 'login.html';

                        return true;
                    });
                }
            })();
    </script>
</body>

</html>
