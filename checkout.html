<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout · LITTLE NEST</title>
    <!-- Custom Favicon -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FFBFA3'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 13c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11 3.5z'/%3E%3C/svg%3E">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&family=Open+Sans:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-primary: #FFFFFF;
            --bg-secondary: #FFF9F6;
            --text-primary: #111111;
            --text-secondary: #2E2E2E;
            --text-muted: #4A4A4A;
            --border-color: #F0E3DC;
            --accent: #FF6B4A;
            --accent-dark: #E05132;
            --accent-light: #FFE1DA;
        }
        body.dark {
            --bg-primary: #121212;
            --bg-secondary: #1E1E1E;
            --text-primary: #F4F1DE;
            --text-secondary: #E0DBCE;
            --text-muted: #9CA3AF;
            --border-color: rgba(255,255,255,0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Open Sans', sans-serif; background: var(--bg-primary); color: var(--text-primary); }
        a { text-decoration: none; color: inherit; }
        
        /* Checkout Navbar */
        .checkout-nav { text-align: center; padding: 1.5rem 0; border-bottom: 1px solid var(--border-color); background: var(--bg-primary); }
        .nav-logo { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; color: var(--text-primary); }
        .nav-logo span { color: var(--accent); }
        .back-to-cart { position: absolute; left: 2rem; top: 2rem; font-family: 'Inter', sans-serif; font-size: 0.9rem; color: var(--text-muted); transition: 0.2s; }
        .back-to-cart:hover { color: var(--accent); }

        .checkout-container { display: flex; min-height: calc(100vh - 85px); }
        
        /* Left Side: Forms */
        .checkout-forms { flex: 1; padding: 3rem; border-right: 1px solid var(--border-color); }
        .form-container { max-width: 600px; margin: 0 auto; }
        
        .section-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; margin-bottom: 1.5rem; color: var(--text-primary); padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color); }
        
        .form-group { margin-bottom: 1.2rem; }
        .form-row { display: flex; gap: 1rem; }
        .form-row > .form-group { flex: 1; }
        
        .form-label { display: block; margin-bottom: 0.5rem; font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 500; }
        .form-control { width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 1rem; background: var(--bg-primary); color: var(--text-primary); transition: 0.2s; outline: none; }
        .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
        
        .payment-methods { display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 1.5rem; }
        .payment-method { border: 1px solid var(--border-color); border-radius: 8px; padding: 1rem; display: flex; align-items: center; gap: 1rem; cursor: pointer; transition: 0.2s; }
        .payment-method:hover { border-color: var(--accent); background: var(--bg-secondary); }
        .payment-method input[type="radio"] { accent-color: var(--accent); width: 18px; height: 18px; }
        
        .btn-primary { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 1.2rem; font-size: 1.1rem; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; transition: 0.3s; margin-top: 2rem; }
        .btn-primary:hover { background: var(--accent-dark); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(224, 81, 50, 0.3); }

        /* Right Side: Summary */
        .checkout-summary { width: 450px; background: var(--bg-secondary); padding: 3rem; }
        
        .summary-item { display: flex; gap: 1rem; margin-bottom: 1.5rem; align-items: center; }
        .item-img-wrap { position: relative; width: 64px; height: 64px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); }
        .item-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .item-qty { position: absolute; top: -8px; right: -8px; background: var(--text-muted); color: #fff; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; z-index: 2; }
        .item-info { flex: 1; }
        .item-title { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.95rem; margin-bottom: 0.2rem; }
        .item-meta { font-size: 0.8rem; color: var(--text-muted); }
        .item-price { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.95rem; }
        
        .divider { height: 1px; background: var(--border-color); margin: 1.5rem 0; }
        
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 0.8rem; font-family: 'Inter', sans-serif; font-size: 0.95rem; color: var(--text-secondary); }
        .summary-row.total { font-size: 1.3rem; font-weight: 700; color: var(--text-primary); margin-top: 1.5rem; }

        @media (max-width: 900px) {
            .checkout-container { flex-direction: column-reverse; }
            .checkout-forms { border-right: none; padding: 2rem 1.5rem; }
            .checkout-summary { width: 100%; padding: 2rem 1.5rem; border-bottom: 1px solid var(--border-color); }
            .back-to-cart { position: static; display: block; margin-bottom: 1rem; }
        }
    </style>
</head>
<body>

<nav class="checkout-nav">
    <a href="cart.html" class="back-to-cart"><i class="fas fa-chevron-left"></i> Return to Cart</a>
    <a href="index.html" class="nav-logo"><span>LITTLE</span> NEST</a>
</nav>

<div class="checkout-container">
    <div class="checkout-forms">
        <div class="form-container">
            <h2 class="section-title">Contact Information</h2>
            <div class="form-group">
                <input type="email" class="form-control" placeholder="Email Address">
            </div>

            <h2 class="section-title" style="margin-top: 2.5rem;">Shipping Address</h2>
            <div class="form-row">
                <div class="form-group"><input type="text" class="form-control" placeholder="First Name"></div>
                <div class="form-group"><input type="text" class="form-control" placeholder="Last Name"></div>
            </div>
            <div class="form-group"><input type="text" class="form-control" placeholder="Address"></div>
            <div class="form-group"><input type="text" class="form-control" placeholder="Apartment, suite, etc. (optional)"></div>
            <div class="form-row">
                <div class="form-group"><input type="text" class="form-control" placeholder="City"></div>
                <div class="form-group"><input type="text" class="form-control" placeholder="State"></div>
                <div class="form-group"><input type="text" class="form-control" placeholder="ZIP Code"></div>
            </div>

            <h2 class="section-title" style="margin-top: 2.5rem;">Payment</h2>
            <div class="payment-methods">
                <label class="payment-method">
                    <input type="radio" name="payment" checked>
                    <span style="flex: 1; font-weight: 500; font-family: 'Inter', sans-serif;">Credit Card</span>
                    <i class="fab fa-cc-visa" style="font-size: 1.5rem; color: #1434CB;"></i>
                    <i class="fab fa-cc-mastercard" style="font-size: 1.5rem; color: #EB001B;"></i>
                </label>
                
                <div style="padding: 1rem; border: 1px solid var(--border-color); border-radius: 8px; margin-top: -0.5rem; margin-bottom: 1rem; border-top: none; border-top-left-radius: 0; border-top-right-radius: 0; background: var(--bg-primary);">
                    <div class="form-group"><input type="text" class="form-control" placeholder="Card Number"></div>
                    <div class="form-row">
                        <div class="form-group"><input type="text" class="form-control" placeholder="Expiration date (MM / YY)"></div>
                        <div class="form-group"><input type="text" class="form-control" placeholder="Security code"></div>
                    </div>
                    <div class="form-group"><input type="text" class="form-control" placeholder="Name on card"></div>
                </div>

                <label class="payment-method">
                    <input type="radio" name="payment">
                    <span style="flex: 1; font-weight: 500; font-family: 'Inter', sans-serif;">PayPal</span>
                    <i class="fab fa-paypal" style="font-size: 1.5rem; color: #00457C;"></i>
                </label>
            </div>

            <button class="btn-primary">Pay $61.15</button>
        </div>
    </div>

    <div class="checkout-summary">
        <div class="summary-item">
            <div class="item-img-wrap">
                <span class="item-qty">1</span>
                <img src="assets/b1.avif" alt="Product">
            </div>
            <div class="item-info">
                <div class="item-title">Organic Cotton Sleepsuit</div>
                <div class="item-meta">3-6M</div>
            </div>
            <div class="item-price">$32.00</div>
        </div>

        <div class="summary-item">
            <div class="item-img-wrap">
                <span class="item-qty">1</span>
                <img src="assets/b6.avif" alt="Product">
            </div>
            <div class="item-info">
                <div class="item-title">Wooden Stacking Rings</div>
                <div class="item-meta">One Size</div>
            </div>
            <div class="item-price">$19.99</div>
        </div>

        <div class="divider"></div>

        <div class="form-row" style="margin-bottom: 1.5rem;">
            <input type="text" class="form-control" placeholder="Discount code">
            <button class="btn-primary" style="margin-top: 0; width: auto; padding: 0 1.5rem; background: var(--border-color); color: var(--text-primary);">Apply</button>
        </div>

        <div class="divider"></div>

        <div class="summary-row">
            <span>Subtotal</span>
            <span>$51.99</span>
        </div>
        <div class="summary-row">
            <span>Shipping</span>
            <span>$5.00</span>
        </div>
        <div class="summary-row">
            <span>Estimated taxes</span>
            <span>$4.16</span>
        </div>
        <div class="divider"></div>
        <div class="summary-row total">
            <span>Total</span>
            <span>$61.15</span>
        </div>
    </div>
</div>

</body>
</html>
